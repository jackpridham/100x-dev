<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vortex Git Control settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Vortex Git Control</p>
        <h1>Keyboard sequences</h1>
        <p class="lede">Press both keys within 1.2 seconds. Sequences are ignored while you type or edit on GitHub.</p>
      </header>
      <section aria-labelledby="bindings-heading">
        <h2 id="bindings-heading">Actions</h2>
        <div id="bindings"></div>
      </section>
      <div class="footer-actions">
        <button id="restore-all" type="button" class="secondary">Restore all defaults</button>
        <button id="save" type="button" class="primary">Save changes</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="scope-note">Version 1 runs only on <strong>github.com</strong>. Leave an action disabled if you do not want a sequence for it.</p>
    </main>
    <script src="src/core.js"></script>
    <script src="options.js"></script>
  </body>
</html>
